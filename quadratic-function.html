  <script>
  (function () {
    'use strict';

    var MAX_X = 10;
    var LIMITS = { a: 10, b: 100, c: 100 };
    var MIN_A = 0.1;
    var DEFAULT_STATE = { a: '1', b: '-2', c: '-3' };
    var STORAGE_KEY = 'quadratic-function.v1';
    var THEME_KEY = 'function-pages.theme';
    var LEGACY_THEME_KEY = 'linear-function.theme';

    function parseField(text, limit) {
      var trimmed = String(text).trim();
      if (trimmed === '') return { ok: false, value: 0 };
      var value = Number(trimmed);
      if (!Number.isFinite(value) || Math.abs(value) > limit) return { ok: false, value: 0 };
      return { ok: true, value: value };
    }

    function parseA(text) {
      var parsed = parseField(text, LIMITS.a);
      if (!parsed.ok) return parsed;
      if (Math.abs(parsed.value) < MIN_A) return { ok: false, value: 0 };
      return parsed;
    }

    function round4(value) {
      return Math.round(value * 1e4) / 1e4;
    }

    function fmt(value, digits) {
      var places = digits === undefined ? 4 : digits;
      var scale = Math.pow(10, places);
      var rounded = Math.round(value * scale) / scale;
      if (!Number.isFinite(rounded)) return '—';
      return Object.is(rounded, -0) ? '0' : String(rounded);
    }

    function formulaOf(a, b, c) {
      var head = a === 1 ? 'x²' : a === -1 ? '-x²' : fmt(a) + 'x²';
      var tail = '';
      if (b !== 0) {
        var bAbs = Math.abs(b);
        var bPart = bAbs === 1 ? 'x' : fmt(bAbs) + 'x';
        tail += (b > 0 ? ' + ' : ' - ') + bPart;
      }
      if (c !== 0) {
        tail += (c > 0 ? ' + ' : ' - ') + fmt(Math.abs(c));
      }
      return 'y = ' + head + tail;
    }

    function vertexOf(a, b, c) {
      var h = -b / (2 * a);
      var k = a * h * h + b * h + c;
      return { h: h, k: k };
    }

    function rootsOf(a, b, c) {
      var delta = b * b - 4 * a * c;
      var scale = Math.abs(b * b) + Math.abs(4 * a * c) + 1;
      if (Math.abs(delta) < 1e-12 * scale) delta = 0;
      if (delta < 0) return { count: 0, delta: delta, roots: [] };
      if (delta === 0) return { count: 1, delta: delta, roots: [-b / (2 * a)] };
      var root = Math.sqrt(delta);
      var first = (-b - root) / (2 * a);
      var second = (-b + root) / (2 * a);
      return { count: 2, delta: delta, roots: [first, second].sort(function (x, y) { return x - y; }) };
    }

    function niceStep(raw) {
      if (!(raw > 0)) return 1;
      var power = Math.pow(10, Math.floor(Math.log10(raw)));
      var normal = Math.round((raw / power) * 100) / 100;
      var factor = normal <= 1 ? 1 : normal <= 2 ? 2 : normal <= 2.5 ? 2.5 : normal <= 5 ? 5 : 10;
      return factor * power;
    }

    function r2(value) {
      var rounded = Math.round(value * 100) / 100;
      return Object.is(rounded, -0) ? 0 : rounded;
    }

    function escapeHtml(text) {
      return String(text).replace(/[&<>"']/g, function (character) {
        return {
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#39;',
        }[character];
      });
    }

    function buildSvg(a, b, c, label) {
      var W = 640;
      var H = 360;
      var padL = 46;
      var padR = 22;
      var padT = 20;
      var padB = 34;
      var xMin = -MAX_X;
      var xMax = MAX_X;
      var samples = [];
      var minY = Infinity;
      var maxY = -Infinity;
      var count = 240;

      for (var step = 0; step <= count; step += 1) {
        var x = xMin + ((xMax - xMin) * step) / count;
        var y = a * x * x + b * x + c;
        if (!Number.isFinite(y)) return '';
        samples.push([x, y]);
        if (y < minY) minY = y;
        if (y > maxY) maxY = y;
      }

      var lo = Math.min(minY, 0);
      var hi = Math.max(maxY, 0);
      if (!Number.isFinite(lo) || !Number.isFinite(hi)) return '';
      if (hi - lo < 2) {
        var mid = (hi + lo) / 2;
        lo = mid - 1;
        hi = mid + 1;
      }
      var pad = (hi - lo) * 0.12;
      lo -= pad;
      hi += pad;

      var yStep = niceStep((hi - lo) / 6);
      var yTicks = [];
      for (var tick = Math.ceil(lo / yStep) * yStep; tick <= hi + yStep * 1e-6; tick += yStep) {
        yTicks.push(Math.round(tick / yStep) * yStep);
      }
      var widest = yTicks.reduce(function (max, value) {
        return Math.max(max, fmt(value, 2).length);
      }, 3);
      padL = Math.min(96, Math.max(40, 10 + widest * 6.4));

      function xTo(x) {
        return padL + ((x - xMin) / (xMax - xMin)) * (W - padL - padR);
      }

      function yTo(y) {
        return H - padB - ((y - lo) / (hi - lo)) * (H - padT - padB);
      }

      var vertex = vertexOf(a, b, c);
      var roots = rootsOf(a, b, c);
      var xTicks = [-10, -5, 0, 5, 10];
      var axisY = yTo(0);
      var axisX = xTo(0);
      var vertexIn = vertex.h >= xMin - 1e-9 && vertex.h <= xMax + 1e-9;

      var parts = [];
      xTicks.forEach(function (x) {
        parts.push('<line class="plot-grid" x1="' + r2(xTo(x)) + '" y1="' + padT + '" x2="' + r2(xTo(x)) + '" y2="' + (H - padB) + '"/>');
      });
      yTicks.forEach(function (y) {
        parts.push('<line class="plot-grid" x1="' + padL + '" y1="' + r2(yTo(y)) + '" x2="' + (W - padR) + '" y2="' + r2(yTo(y)) + '"/>');
      });
      if (vertexIn) {
        parts.push('<line class="plot-sym" x1="' + r2(xTo(vertex.h)) + '" y1="' + padT + '" x2="' + r2(xTo(vertex.h)) + '" y2="' + (H - padB) + '"/>');
      }
      parts.push('<line class="plot-axis" x1="' + padL + '" y1="' + r2(axisY) + '" x2="' + (W - padR) + '" y2="' + r2(axisY) + '"/>');
      parts.push('<line class="plot-axis" x1="' + r2(axisX) + '" y1="' + padT + '" x2="' + r2(axisX) + '" y2="' + (H - padB) + '"/>');
      parts.push('<text class="plot-axis-label" x="' + (W - padR + 6) + '" y="' + r2(axisY + 4) + '">x</text>');
      parts.push('<text class="plot-axis-label" x="' + r2(axisX + 6) + '" y="' + (padT + 2) + '">y</text>');
      xTicks.forEach(function (x) {
        parts.push('<text class="plot-tick" x="' + r2(xTo(x)) + '" y="' + (H - padB + 16) + '" text-anchor="middle">' + fmt(x, 2) + '</text>');
      });
      yTicks.forEach(function (y) {
        parts.push('<text class="plot-tick" x="' + (padL - 8) + '" y="' + r2(yTo(y) + 4) + '" text-anchor="end">' + fmt(y, 2) + '</text>');
      });

      var path = samples.map(function (point, index) {
        return (index === 0 ? 'M' : 'L') + r2(xTo(point[0])) + ',' + r2(yTo(point[1]));
      }).join('');
      parts.push('<path class="plot-line" d="' + path + '"/>');

      if (roots.count > 0) {
        roots.roots.forEach(function (root, index) {
          if (root >= xMin - 1e-9 && root <= xMax + 1e-9) {
            parts.push('<circle class="plot-dot" cx="' + r2(xTo(root)) + '" cy="' + r2(yTo(0)) + '" r="4" data-root="' + index + '"/>');
          }
        });
      }
      parts.push('<circle class="plot-dot" cx="' + r2(xTo(0)) + '" cy="' + r2(yTo(c)) + '" r="4"/>');
      if (vertexIn) {
        parts.push('<circle class="plot-dot" cx="' + r2(xTo(vertex.h)) + '" cy="' + r2(yTo(vertex.k)) + '" r="4.5"/>');
      }

      return '<svg class="plot-svg" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + escapeHtml(label) + '" preserveAspectRatio="xMidYMid meet">' + parts.join('') + '</svg>';
    }

    globalThis.__quadraticFunction = {
      parseField: parseField,
      parseA: parseA,
      round4: round4,
      fmt: fmt,
      formulaOf: formulaOf,
      vertexOf: vertexOf,
      rootsOf: rootsOf,
      niceStep: niceStep,
      buildSvg: buildSvg,
      escapeHtml: escapeHtml
    };

    function readState() {
      try {
        var raw = localStorage.getItem(STORAGE_KEY);
        if (raw === null) return { a: DEFAULT_STATE.a, b: DEFAULT_STATE.b, c: DEFAULT_STATE.c };
        var parsed = JSON.parse(raw);
        var aParsed = parseA(parsed && parsed.a);
        var bParsed = parseField(parsed && parsed.b, LIMITS.b);
        var cParsed = parseField(parsed && parsed.c, LIMITS.c);
        return {
          a: aParsed.ok ? String(aParsed.value) : DEFAULT_STATE.a,
          b: bParsed.ok ? String(bParsed.value) : DEFAULT_STATE.b,
          c: cParsed.ok ? String(cParsed.value) : DEFAULT_STATE.c,
        };
      } catch (error) {
        return { a: DEFAULT_STATE.a, b: DEFAULT_STATE.b, c: DEFAULT_STATE.c };
      }
    }

    function saveState(state) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({ a: state.a, b: state.b, c: state.c }));
      } catch (error) {
        /* 无痕模式或存储被禁用时，页面仍可正常使用。 */
      }
    }

    function init() {
      var aInput = document.getElementById('a');
      var bInput = document.getElementById('b');
      var cInput = document.getElementById('c');
      var formulaEl = document.getElementById('formula');
      var hintEl = document.getElementById('hint');
      var plotEl = document.getElementById('plot');
      var propsEl = document.getElementById('props');
      var resetBtn = document.getElementById('reset');
      var themeBtn = document.getElementById('theme-toggle');
      var state = readState();

      aInput.value = state.a;
      bInput.value = state.b;
      cInput.value = state.c;

      function fitPlotText() {
        var innerWidth = plotEl.clientWidth - 24;
        if (!innerWidth) return;
        var scale = innerWidth / 640;
        var tick = Math.min(26, Math.max(9, 11 / scale));
        var axis = Math.min(32, Math.max(10, 12.5 / scale));
        plotEl.style.setProperty('--plot-tick-size', tick + 'px');
        plotEl.style.setProperty('--plot-axis-size', axis + 'px');
      }

      function render() {
        var aParsed = parseA(state.a);
        var bParsed = parseField(state.b, LIMITS.b);
        var cParsed = parseField(state.c, LIMITS.c);
        var valid = aParsed.ok && bParsed.ok && cParsed.ok;
        var a = valid ? round4(aParsed.value) : 1;
        var b = valid ? round4(bParsed.value) : 0;
        var c = valid ? round4(cParsed.value) : 0;
        var formula = valid ? formulaOf(a, b, c) : '—';
        var props;

        formulaEl.textContent = formula;
        hintEl.hidden = valid;

        if (aParsed.ok) aInput.removeAttribute('aria-describedby');
        else aInput.setAttribute('aria-describedby', 'hint');
        if (bParsed.ok) bInput.removeAttribute('aria-describedby');
        else bInput.setAttribute('aria-describedby', 'hint');
        if (cParsed.ok) cInput.removeAttribute('aria-describedby');
        else cInput.setAttribute('aria-describedby', 'hint');
        aInput.setAttribute('aria-invalid', aParsed.ok ? 'false' : 'true');
        bInput.setAttribute('aria-invalid', bParsed.ok ? 'false' : 'true');
        cInput.setAttribute('aria-invalid', cParsed.ok ? 'false' : 'true');

        if (valid) {
          var vertex = vertexOf(a, b, c);
          var roots = rootsOf(a, b, c);
          var h = fmt(vertex.h);
          var k = fmt(vertex.k);
          var opening = a > 0 ? '向上' : '向下';
          var extreme = a > 0 ? '最小值 ' + k : '最大值 ' + k;
          var xText;
          if (roots.count === 0) {
            xText = '无实数根';
          } else if (roots.count === 1) {
            xText = '(' + fmt(roots.roots[0]) + ', 0)（与 x 轴相切）';
          } else {
            xText = '(' + fmt(roots.roots[0]) + ', 0)，(' + fmt(roots.roots[1]) + ', 0)';
          }
          var mono = a > 0
            ? 'x < ' + h + ' 递减，x > ' + h + ' 递增'
            : 'x < ' + h + ' 递增，x > ' + h + ' 递减';

          props = [
            ['开口方向', opening],
            ['顶点', '(' + h + ', ' + k + ')'],
            ['对称轴', 'x = ' + h],
            ['最值', extreme],
            ['与 y 轴交点', '(0, ' + fmt(c) + ')'],
            ['与 x 轴交点', xText],
            ['判别式 Δ', fmt(roots.delta)],
            ['单调性', mono],
          ];

          var summary = '二次函数图像：' + formula + '；' + props.map(function (row) {
            return row[0] + ' ' + row[1];
          }).join('；');
          plotEl.innerHTML = buildSvg(a, b, c, summary);
        } else {
          props = [
            ['开口方向', '—'],
            ['顶点', '—'],
            ['对称轴', '—'],
            ['最值', '—'],
            ['与 y 轴交点', '—'],
            ['与 x 轴交点', '—'],
            ['判别式 Δ', '—'],
            ['单调性', '—'],
          ];
          plotEl.innerHTML = '<div class="plot-empty">输入有效的 a、b、c 后显示图像</div>';
        }

        propsEl.innerHTML = props.map(function (row) {
          return '<div class="prop"><dt>' + escapeHtml(row[0]) + '</dt><dd>' + escapeHtml(row[1]) + '</dd></div>';
        }).join('');

        fitPlotText();
      }

      function commit(next) {
        state = next;
        aInput.value = state.a;
        bInput.value = state.b;
        cInput.value = state.c;
        if (parseA(state.a).ok && parseField(state.b, LIMITS.b).ok && parseField(state.c, LIMITS.c).ok) saveState(state);
        render();
      }

      function updateFromInput(field, value) {
        state = { a: state.a, b: state.b, c: state.c };
        state[field] = value;
        if (parseA(state.a).ok && parseField(state.b, LIMITS.b).ok && parseField(state.c, LIMITS.c).ok) saveState(state);
        render();
      }

      aInput.addEventListener('input', function () { updateFromInput('a', aInput.value); });
      bInput.addEventListener('input', function () { updateFromInput('b', bInput.value); });
      cInput.addEventListener('input', function () { updateFromInput('c', cInput.value); });

      Array.prototype.forEach.call(document.querySelectorAll('.chip'), function (chip) {
        chip.addEventListener('click', function () {
          commit({
            a: chip.getAttribute('data-a'),
            b: chip.getAttribute('data-b'),
            c: chip.getAttribute('data-c'),
          });
        });
      });

      resetBtn.addEventListener('click', function () {
        commit({ a: DEFAULT_STATE.a, b: DEFAULT_STATE.b, c: DEFAULT_STATE.c });
      });

      function currentTheme() {
        return document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
      }

      function syncThemeButton() {
        var nextLabel = currentTheme() === 'dark' ? '切换到浅色主题' : '切换到深色主题';
        themeBtn.setAttribute('aria-label', nextLabel);
        themeBtn.setAttribute('title', nextLabel);
      }

      themeBtn.addEventListener('click', function () {
        var next = currentTheme() === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        try {
          localStorage.setItem(THEME_KEY, next);
          localStorage.removeItem(LEGACY_THEME_KEY);
        } catch (error) {
          /* 无法保存时仅影响下次打开。 */
        }
        syncThemeButton();
      });

      syncThemeButton();
      render();

      if (typeof ResizeObserver !== 'undefined') {
        new ResizeObserver(function () {
          fitPlotText();
        }).observe(plotEl);
      }
    }

    if (typeof document === 'undefined') {
      /* 无 DOM 环境（用于本地逻辑自检）：只暴露纯函数。 */
    } else if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  })();
  </script>
</body>
</html>
